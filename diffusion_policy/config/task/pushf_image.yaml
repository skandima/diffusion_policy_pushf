name: pushf_image

image_shape: &image_shape [3, 96, 96]
shape_meta: &shape_meta
  obs:
    image:
      shape: *image_shape
      type: rgb
    agent_pos:
      shape: [2]
      type: low_dim
  action:
    shape: [2]

env_runner:
  _target_: diffusion_policy.env_runner.pushf_image_runner.PushFImageRunner
  n_train: 6
  n_train_vis: 2
  train_start_seed: 0
  n_test: 10
  n_test_vis: 2
  legacy_test: False
  test_start_seed: 100000
  max_steps: 300
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  past_action: ${past_action_visible}
  n_envs: null

dataset:
  _target_: diffusion_policy.dataset.pushf_image_dataset.PushFImageDataset
  zarr_path: data/pushf/pushf_replay.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: 90
